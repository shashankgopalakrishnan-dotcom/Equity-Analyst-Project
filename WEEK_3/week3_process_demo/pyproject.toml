[project]
name = "week3_process_demo"
version = "0.1.0"
description = "week3_process_demo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai]>=1.15.34,<2.0.0",
]

[project.scripts]
kickoff = "week3_process_demo.main:kickoff"
run_crew = "week3_process_demo.main:kickoff"
plot = "week3_process_demo.main:plot"
run_with_trigger = "week3_process_demo.main:run_with_trigger"
research-analyst = "week3_process_demo.research_analyst:kickoff"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/week3_process_demo"]


[tool.crewai]
type = "flow"
project_id = "a42164c0-fc3f-4358-8a1e-514cd48a0bec"
